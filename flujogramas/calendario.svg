<text x="362" y="156" font-size="12.5" fill="#fff" opacity=".93">COM</text>
<rect x="348" y="195" width="250" height="64" rx="10" fill="#6b7280"/>
<text x="362" y="219" font-size="14.5" font-weight="700" fill="#fff">Enlace ICS</text>
