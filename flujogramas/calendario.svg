<text x="686" y="139" font-size="12.5" fill="#fff" opacity=".93">Ventana tkinter de escritorio</text>
<text x="686" y="156" font-size="12.5" fill="#fff" opacity=".93">Rejilla por horas, lista, ambas o</text>
<text x="686" y="173" font-size="12.5" fill="#fff" opacity=".93">mes</text>
<text x="686" y="190" font-size="12.5" fill="#fff" opacity=".93">Descarga los eventos, reparte</text>
<text x="686" y="207" font-size="12.5" fill="#fff" opacity=".93">columnas y detecta solapes</text>
<text x="686" y="224" font-size="12.5" fill="#fff" opacity=".93">Avisos previos y alarmas por evento</text>
