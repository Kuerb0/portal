<text x="38" y="439" font-size="12.5" fill="#fff" opacity=".93">librerías que falten</text>
<text x="38" y="456" font-size="12.5" fill="#fff" opacity=".93">Conserva tu configuración y tus</text>
<text x="38" y="473" font-size="12.5" fill="#fff" opacity=".93">perfiles</text>
