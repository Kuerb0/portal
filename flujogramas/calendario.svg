<text x="38" y="120" font-size="14.5" font-weight="700" fill="#fff" font-family="Consolas, monospace">Instalador.bat</text>
<text x="38" y="139" font-size="12.5" fill="#fff" opacity=".93">Crea app/ y datos/</text>
<text x="38" y="156" font-size="12.5" fill="#fff" opacity=".93">Usa tu Python (3.9+) o instala uno</text>
<text x="38" y="173" font-size="12.5" fill="#fff" opacity=".93">en python/</text>
<text x="38" y="190" font-size="12.5" fill="#fff" opacity=".93">Instala las librerías de</text>
<text x="38" y="207" font-size="12.5" fill="#fff" opacity=".93">requirements.txt</text>
<text x="38" y="224" font-size="12.5" fill="#fff" opacity=".93">Acceso directo y arranque con</text>
<text x="38" y="241" font-size="12.5" fill="#fff" opacity=".93">Windows (si quieres)</text>
<rect x="24" y="280" width="250" height="81" rx="10" fill="#1f9a52"/>
<text x="38" y="304" font-size="14.5" font-weight="700" fill="#fff" font-family="Consolas, monospace">configurar.py</text>
<text x="38" y="323" font-size="12.5" fill="#fff" opacity=".93">Asistente: de dónde leer los</text>
<text x="38" y="340" font-size="12.5" fill="#fff" opacity=".93">eventos, festivos y cómo verlos</text>
