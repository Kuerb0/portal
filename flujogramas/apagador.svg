<text x="38" y="120" font-size="14.5" font-weight="700" fill="#fff" font-family="Consolas, monospace">Instalador.bat</text>
<text x="38" y="139" font-size="12.5" fill="#fff" opacity=".93">Lleva el programa dentro</text>
<text x="38" y="156" font-size="12.5" fill="#fff" opacity=".93">Busca Python 3.10+ con tkinter; si</text>
<text x="38" y="173" font-size="12.5" fill="#fff" opacity=".93">no hay, lo instala en la carpeta de</text>
<text x="38" y="190" font-size="12.5" fill="#fff" opacity=".93">la app (sin administrador)</text>
<rect x="24" y="229" width="250" height="98" rx="10" fill="#0f766e"/>
<text x="38" y="253" font-size="14.5" font-weight="700" fill="#fff" font-family="Consolas, monospace">Actualizar.bat</text>
<text x="38" y="272" font-size="12.5" fill="#fff" opacity=".93">Guarda la versión anterior en</text>
<text x="38" y="289" font-size="12.5" fill="#fff" opacity=".93">anteriores/ y pone la nueva</text>
<text x="38" y="306" font-size="12.5" fill="#fff" opacity=".93">Actualiza los accesos directos</text>
<rect x="24" y="345" width="250" height="81" rx="10" fill="#0f766e"/>
<text x="38" y="369" font-size="14.5" font-weight="700" fill="#fff" font-family="Consolas, monospace">Crear_acceso_directo.vbs</text>
<text x="38" y="388" font-size="12.5" fill="#fff" opacity=".93">Acceso directo del Escritorio con el</text>
<text x="38" y="405" font-size="12.5" fill="#fff" opacity=".93">icono</text>
<rect x="348" y="96" width="250" height="115" rx="10" fill="#1f9a52"/>
<text x="362" y="120" font-size="14.5" font-weight="700" fill="#fff" font-family="Consolas, monospace">apagador_app.py</text>
<text x="362" y="139" font-size="12.5" fill="#fff" opacity=".93">Ventana tkinter siempre encima</text>
<text x="362" y="156" font-size="12.5" fill="#fff" opacity=".93">Elige duración en minutos o hora</text>
<text x="362" y="173" font-size="12.5" fill="#fff" opacity=".93">exacta</text>
<text x="362" y="190" font-size="12.5" fill="#fff" opacity=".93">Botones Programar y Cancelar</text>
<rect x="348" y="229" width="250" height="98" rx="10" fill="#2b6bd6"/>
<text x="362" y="253" font-size="14.5" font-weight="700" fill="#fff">calcular_segundos()</text>
<text x="362" y="272" font-size="12.5" fill="#fff" opacity=".93">Duración → segundos</text>
<text x="362" y="289" font-size="12.5" fill="#fff" opacity=".93">Hora exacta → segundos hasta hoy (o</text>
<text x="362" y="306" font-size="12.5" fill="#fff" opacity=".93">mañana si ya pasó)</text>
<rect x="348" y="345" width="250" height="115" rx="10" fill="#2b6bd6"/>
<text x="362" y="369" font-size="14.5" font-weight="700" fill="#fff">cuenta atrás</text>
<text x="362" y="388" font-size="12.5" fill="#fff" opacity=".93">Cada segundo resta y enseña el</text>
<text x="362" y="405" font-size="12.5" fill="#fff" opacity=".93">tiempo que queda</text>
<text x="362" y="422" font-size="12.5" fill="#fff" opacity=".93">Cancelar la detiene en cualquier</text>
<text x="362" y="439" font-size="12.5" fill="#fff" opacity=".93">momento</text>
<rect x="672" y="96" width="250" height="64" rx="10" fill="#6b7280"/>
<text x="686" y="120" font-size="14.5" font-weight="700" fill="#fff">shutdown /s /f /t 0</text>
<text x="686" y="139" font-size="12.5" fill="#fff" opacity=".93">Apaga el equipo al llegar a cero</text>
<rect x="672" y="178" width="250" height="64" rx="10" fill="#6b7280"/>
<text x="686" y="202" font-size="14.5" font-weight="700" fill="#fff">shutdown /a</text>
<text x="686" y="221" font-size="12.5" fill="#fff" opacity=".93">Cancela el apagado programado</text>
