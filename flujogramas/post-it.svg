<rect x="24" y="96" width="250" height="149" rx="10" fill="#0f766e"/>
<text x="38" y="120" font-size="14.5" font-weight="700" fill="#fff" font-family="Consolas, monospace">instalar.bat</text>
<text x="38" y="139" font-size="12.5" fill="#fff" opacity=".93">Comprueba que está Node.js</text>
<text x="38" y="156" font-size="12.5" fill="#fff" opacity=".93">npm install electron en</text>
<text x="38" y="173" font-size="12.5" fill="#fff" opacity=".93">%LOCALAPPDATA%\PostIt (fuera de</text>
<text x="38" y="190" font-size="12.5" fill="#fff" opacity=".93">OneDrive, ~300 MB)</text>
<text x="38" y="207" font-size="12.5" fill="#fff" opacity=".93">Crea el acceso directo «Post-its» y</text>
<text x="38" y="224" font-size="12.5" fill="#fff" opacity=".93">el arranque con Windows</text>
<rect x="24" y="263" width="250" height="115" rx="10" fill="#0f766e"/>
<text x="38" y="287" font-size="14.5" font-weight="700" fill="#fff" font-family="Consolas, monospace">actualizar.bat</text>
<text x="38" y="306" font-size="12.5" fill="#fff" opacity=".93">git pull del código y reinicia la</text>
<text x="38" y="323" font-size="12.5" fill="#fff" opacity=".93">app</text>
<text x="38" y="340" font-size="12.5" fill="#fff" opacity=".93">No toca tus notas: notes.json queda</text>
<text x="38" y="357" font-size="12.5" fill="#fff" opacity=".93">fuera de git</text>
<rect x="348" y="96" width="250" height="149" rx="10" fill="#475569"/>
<text x="362" y="120" font-size="14.5" font-weight="700" fill="#fff">main.js (Electron)</text>
<text x="362" y="139" font-size="12.5" fill="#fff" opacity=".93">Una sola instancia</text>
<text x="362" y="156" font-size="12.5" fill="#fff" opacity=".93">Una ventana de 340×340 por nota;</text>
<text x="362" y="173" font-size="12.5" fill="#fff" opacity=".93">recuerda su posición</text>
<text x="362" y="190" font-size="12.5" fill="#fff" opacity=".93">Bandeja: Nueva nota · Mostrar todas</text>
<text x="362" y="207" font-size="12.5" fill="#fff" opacity=".93">· Salir</text>
<text x="362" y="224" font-size="12.5" fill="#fff" opacity=".93">Arranca con Windows</text>
<rect x="348" y="263" width="250" height="98" rx="10" fill="#0f766e"/>
<text x="362" y="287" font-size="14.5" font-weight="700" fill="#fff">PowerShell auxiliar</text>
<text x="362" y="306" font-size="12.5" fill="#fff" opacity=".93">Electron no tiene «siempre debajo»:</text>
<text x="362" y="323" font-size="12.5" fill="#fff" opacity=".93">llama a SetWindowPos(HWND_BOTTOM)</text>
<text x="362" y="340" font-size="12.5" fill="#fff" opacity=".93">con cada ventana</text>
<rect x="672" y="96" width="250" height="98" rx="10" fill="#2b6bd6"/>
<text x="686" y="120" font-size="14.5" font-weight="700" fill="#fff" font-family="Consolas, monospace">preload.js</text>
<text x="686" y="139" font-size="12.5" fill="#fff" opacity=".93">Puente con el proceso principal:</text>
<text x="686" y="156" font-size="12.5" fill="#fff" opacity=".93">get, save, color, z, glass, cols,</text>
<text x="686" y="173" font-size="12.5" fill="#fff" opacity=".93">new, del, close</text>
<rect x="672" y="212" width="250" height="149" rx="10" fill="#1f9a52"/>
<text x="686" y="236" font-size="14.5" font-weight="700" fill="#fff" font-family="Consolas, monospace">note.html</text>
<text x="686" y="255" font-size="12.5" fill="#fff" opacity=".93">Editor de la nota con casillas de</text>
<text x="686" y="272" font-size="12.5" fill="#fff" opacity=".93">tarea</text>
<text x="686" y="289" font-size="12.5" fill="#fff" opacity=".93">Tareas repetibles: @diario @semanal</text>
<text x="686" y="306" font-size="12.5" fill="#fff" opacity=".93">@lunes…</text>
<text x="686" y="323" font-size="12.5" fill="#fff" opacity=".93">Color, cristal (65 %), encima o</text>
<text x="686" y="340" font-size="12.5" fill="#fff" opacity=".93">debajo, columnas</text>
<rect x="996" y="96" width="250" height="115" rx="10" fill="#eef1f6" stroke="#c9d1e0" stroke-width="1.5"/>
<text x="1010" y="120" font-size="14.5" font-weight="700" fill="#1f2937" font-family="Consolas, monospace">notes.json</text>
<text x="1010" y="139" font-size="12.5" fill="#1f2937" opacity=".93">Las notas, en OneDrive: se</text>
<text x="1010" y="156" font-size="12.5" fill="#1f2937" opacity=".93">sincronizan entre equipos</text>
<text x="1010" y="173" font-size="12.5" fill="#1f2937" opacity=".93">Se vigila cada 3 s: si OneDrive trae</text>
<text x="1010" y="190" font-size="12.5" fill="#1f2937" opacity=".93">cambios, se recargan</text>
<rect x="996" y="229" width="250" height="81" rx="10" fill="#eef1f6" stroke="#c9d1e0" stroke-width="1.5"/>
<text x="1010" y="253" font-size="14.5" font-weight="700" fill="#1f2937" font-family="Consolas, monospace">pos.json</text>
<text x="1010" y="272" font-size="12.5" fill="#1f2937" opacity=".93">Posición y tamaño de cada ventana</text>
<text x="1010" y="289" font-size="12.5" fill="#1f2937" opacity=".93">(en este equipo)</text>
<rect x="258.8" y="149.1" width="104.5" height="17" rx="5" fill="#fff" opacity=".92"/><text x="311.0" y="162.1" font-size="11.5" text-anchor="middle" fill="#4b8df8">instala y lanza</text>
<rect x="277.6" y="248.9" width="66.7" height="17" rx="5" fill="#fff" opacity=".92"/><text x="311.0" y="261.9" font-size="11.5" text-anchor="middle" fill="#f5a623">actualiza</text>
<rect x="585.9" y="130.1" width="98.2" height="17" rx="5" fill="#fff" opacity=".92"/><text x="635.0" y="143.1" font-size="11.5" text-anchor="middle" fill="#a78bfa">abre cada nota</text>
<rect x="782.5" y="194.0" width="28.9" height="17" rx="5" fill="#fff" opacity=".92"/><text x="797.0" y="207.0" font-size="11.5" text-anchor="middle" fill="#64748b">IPC</text>
<rect x="414.4" y="245.0" width="117.1" height="17" rx="5" fill="#fff" opacity=".92"/><text x="473.0" y="258.0" font-size="11.5" text-anchor="middle" fill="#64748b">ventanas «debajo»</text>
<rect x="741.6" y="153.0" width="110.8" height="17" rx="5" fill="#fff" opacity=".92"/><text x="797.0" y="166.0" font-size="11.5" text-anchor="middle" fill="#f5a623">guarda y recarga</text>
