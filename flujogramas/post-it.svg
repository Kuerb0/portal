<line x1="206" y1="438" x2="240" y2="438" stroke="#f5a623" stroke-width="2.5"/><text x="248" y="442" font-size="12.5" fill="#9aa3b2">lee y escribe</text>
<line x1="367" y1="438" x2="401" y2="438" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="6 5"/><text x="409" y="442" font-size="12.5" fill="#9aa3b2">lanza / abre</text>
<line x1="521" y1="438" x2="555" y2="438" stroke="#64748b" stroke-width="2.5"/><text x="563" y="442" font-size="12.5" fill="#9aa3b2">llama a</text>
