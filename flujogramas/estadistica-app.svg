<rect x="24" y="96" width="250" height="149" rx="10" fill="#0f766e"/>
<text x="38" y="120" font-size="14.5" font-weight="700" fill="#fff" font-family="Consolas, monospace">Instalador.exe</text>
<text x="38" y="139" font-size="12.5" fill="#fff" opacity=".93">Asistente con ventana, sin consola,</text>
<text x="38" y="156" font-size="12.5" fill="#fff" opacity=".93">que lleva el programa dentro</text>
<text x="38" y="173" font-size="12.5" fill="#fff" opacity=".93">Copia a</text>
<text x="38" y="190" font-size="12.5" fill="#fff" opacity=".93">%LOCALAPPDATA%\Programs\Estadistica,</text>
<text x="38" y="207" font-size="12.5" fill="#fff" opacity=".93">crea accesos directos y se registra</text>
<text x="38" y="224" font-size="12.5" fill="#fff" opacity=".93">en Aplicaciones instaladas</text>
<rect x="24" y="263" width="250" height="115" rx="10" fill="#0f766e"/>
<text x="38" y="287" font-size="14.5" font-weight="700" fill="#fff" font-family="Consolas, monospace">Desinstalar.exe</text>
<text x="38" y="306" font-size="12.5" fill="#fff" opacity=".93">Quita la carpeta, los accesos</text>
<text x="38" y="323" font-size="12.5" fill="#fff" opacity=".93">directos y el registro</text>
<text x="38" y="340" font-size="12.5" fill="#fff" opacity=".93">No borra nada si no tiene</text>
<text x="38" y="357" font-size="12.5" fill="#fff" opacity=".93">Estadistica.exe al lado</text>
<rect x="348" y="96" width="250" height="115" rx="10" fill="#475569"/>
<text x="362" y="120" font-size="14.5" font-weight="700" fill="#fff" font-family="Consolas, monospace">Estadistica.exe</text>
<text x="362" y="139" font-size="12.5" fill="#fff" opacity=".93">pywebview + WebView2: una ventana</text>
<text x="362" y="156" font-size="12.5" fill="#fff" opacity=".93">nativa de Windows</text>
<text x="362" y="173" font-size="12.5" fill="#fff" opacity=".93">El título lleva la versión; icono</text>
<text x="362" y="190" font-size="12.5" fill="#fff" opacity=".93">propio en la barra de tareas</text>
<rect x="348" y="229" width="250" height="166" rx="10" fill="#1f9a52"/>
<text x="362" y="253" font-size="14.5" font-weight="700" fill="#fff">web/ (HTML + JS)</text>
<text x="362" y="272" font-size="12.5" fill="#fff" opacity=".93">12 páginas: Conceptos, Descriptiva,</text>
<text x="362" y="289" font-size="12.5" fill="#fff" opacity=".93">Distribuciones, Contrastes, Bayes,</text>
<text x="362" y="306" font-size="12.5" fill="#fff" opacity=".93">Regresiones, Clasificación,</text>
<text x="362" y="323" font-size="12.5" fill="#fff" opacity=".93">Supervivencia, Clustering,</text>
<text x="362" y="340" font-size="12.5" fill="#fff" opacity=".93">Actuarial, Índice y Apariencia</text>
<text x="362" y="357" font-size="12.5" fill="#fff" opacity=".93">Gráficos en canvas con animaciones y</text>
<text x="362" y="374" font-size="12.5" fill="#fff" opacity=".93">buscador global Ctrl+K</text>
<rect x="672" y="96" width="250" height="132" rx="10" fill="#2b6bd6"/>
<text x="686" y="120" font-size="14.5" font-weight="700" fill="#fff">py/ (Python)</text>
<text x="686" y="139" font-size="12.5" fill="#fff" opacity=".93">Solo calcula: numpy, scipy y</text>
<text x="686" y="156" font-size="12.5" fill="#fff" opacity=".93">statsmodels</text>
<text x="686" y="173" font-size="12.5" fill="#fff" opacity=".93">Un módulo por página:</text>
<text x="686" y="190" font-size="12.5" fill="#fff" opacity=".93">regresiones.py, clustering.py,</text>
<text x="686" y="207" font-size="12.5" fill="#fff" opacity=".93">reservas.py…</text>
<rect x="672" y="246" width="250" height="81" rx="10" fill="#2b6bd6"/>
<text x="686" y="270" font-size="14.5" font-weight="700" fill="#fff">Código equivalente</text>
<text x="686" y="289" font-size="12.5" fill="#fff" opacity=".93">Cada resultado trae su código en</text>
<text x="686" y="306" font-size="12.5" fill="#fff" opacity=".93">Python, R y SAS para copiar</text>
<rect x="996" y="96" width="250" height="98" rx="10" fill="#eef1f6" stroke="#c9d1e0" stroke-width="1.5"/>
<text x="1010" y="120" font-size="14.5" font-weight="700" fill="#1f2937">Tu CSV</text>
<text x="1010" y="139" font-size="12.5" fill="#1f2937" opacity=".93">Regresiones, Clustering y Reservas</text>
<text x="1010" y="156" font-size="12.5" fill="#1f2937" opacity=".93">aceptan tus propios datos</text>
<text x="1010" y="173" font-size="12.5" fill="#1f2937" opacity=".93">No se envía nada a ningún sitio</text>
<rect x="996" y="212" width="250" height="81" rx="10" fill="#eef1f6" stroke="#c9d1e0" stroke-width="1.5"/>
<text x="1010" y="236" font-size="14.5" font-weight="700" fill="#1f2937">Apariencia guardada</text>
<text x="1010" y="255" font-size="12.5" fill="#1f2937" opacity=".93">Paleta, estilo y fondo animado se</text>
<text x="1010" y="272" font-size="12.5" fill="#1f2937" opacity=".93">recuerdan al cerrar</text>
