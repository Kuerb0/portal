<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vuelos</title>
<meta name="description" content="Compara vuelos, hoteles y trenes de todos los días: mapa, gráficos y filtros.">
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eef3fb" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vuelos">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{color-scheme:light dark;--pie:52px;--fondo:#eef3fb;--texto:#1b2230;--suave:#5b6577;--acento:#1a5fcf}
@media (prefers-color-scheme:dark){:root{--fondo:#0b1220;--texto:#e8ecf5;--suave:#9aa6bf;--acento:#6ea8ff}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--fondo);color:var(--texto);font-family:"Segoe UI",system-ui,-apple-system,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#caja{position:fixed;z-index:2;overflow:hidden;
 top:env(safe-area-inset-top);right:env(safe-area-inset-right);bottom:env(safe-area-inset-bottom);left:env(safe-area-inset-left)}
/* Streamlit Cloud añade debajo su barra «Built with Streamlit · Fullscreen»: el marco se estira por debajo de la pantalla
   (PIE px) para dejarla fuera; la app ocupa lo visible y su contenido no se pierde. Si la barra cambia de alto, se ajusta aquí. */
#app{display:block;width:100%;height:calc(100% + var(--pie));border:0;background:transparent}
.centro{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:.8rem;text-align:center;padding:1.5rem}
.centro img{width:84px;height:84px;border-radius:20px}
.centro p{margin:0;max-width:22rem}
.centro .suave{color:var(--suave);font-size:.92rem}
#carga{z-index:1}
#sin-red{z-index:3;background:var(--fondo)}
#sin-red button{margin-top:.4rem;padding:.65rem 1.4rem;border:0;border-radius:10px;background:var(--acento);color:#fff;font-size:1rem;font-weight:600;cursor:pointer}
#sin-red button:focus-visible{outline:3px solid var(--acento);outline-offset:3px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="carga" class="centro" role="status">
  <img src="icon-192.png" alt="" width="84" height="84">
  <p><strong>Abriendo Vuelos…</strong></p>
  <p class="suave">Si la app llevaba un rato sin usarse, puede tardar medio minuto en despertar.</p>
</div>

<div id="sin-red" class="centro" hidden role="alert">
  <img src="icon-192.png" alt="" width="84" height="84">
  <p><strong>Sin conexión</strong></p>
  <p class="suave">Vuelos necesita internet para funcionar. Conéctate y vuelve a intentarlo.</p>
  <button id="reintentar" type="button">Reintentar</button>
</div>

<div id="caja"><iframe id="app" title="Vuelos, hoteles y trenes" allow="clipboard-write; fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe></div>

<script>
// La app de Streamlit va dentro de este marco. «embed=true» le quita la cabecera y el pie de Streamlit.
const URL_APP = "https://kuerb0-viajes-pyapp-web-iufxrb.streamlit.app/?embed=true";
const marco = document.getElementById("app"), sinRed = document.getElementById("sin-red");

function abrir() {
  sinRed.hidden = navigator.onLine;
  if (navigator.onLine) marco.src = URL_APP;       // sin conexión no se intenta: saldría la página de error del navegador
}
document.getElementById("reintentar").addEventListener("click", abrir);
addEventListener("online", abrir);
addEventListener("offline", () => { sinRed.hidden = false; });
abrir();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
<script src="../instalar.js" data-aviso="Vuelos"></script>
</body>
</html>
