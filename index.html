<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mario · webs</title>
<meta name="description" content="Pequeñas webs interactivas para aprender y hacer cuentas: viajes, estadística básica, finanzas personales y más.">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<header class="cabecera">
  <button id="tema" class="tema" type="button" aria-label="Cambiar entre tema claro y oscuro">🌓</button>
  <a class="perfil" href="https://github.com/Kuerb0" target="_blank" rel="noopener" aria-label="Perfil de GitHub">
    <img class="avatar" src="https://github.com/Kuerb0.png?size=200" alt="Foto de perfil" width="104" height="104" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'avatar sin',textContent:'M'}))">
  </a>
  <h1>Mario</h1>
  <p class="lema">Pequeñas webs interactivas para entender cosas con números.</p>
  <p class="enlaces"><a href="https://github.com/Kuerb0" target="_blank" rel="noopener">GitHub · Kuerb0</a></p>
</header>

<main>
  <div class="buscador"><input id="buscar" type="search" placeholder="Buscar una web…" aria-label="Buscar una web"></div>
  <section id="rejilla" class="rejilla" aria-live="polite"></section>
  <p id="vacio" class="vacio" hidden>Ninguna web coincide con la búsqueda.</p>
</main>

<footer class="pie">
  <p>Hecho con Python y Streamlit. Las webs gratuitas se duermen si nadie las visita: la primera carga puede tardar medio minuto.</p>
</footer>
<script src="portal.js"></script>
</body>
</html>
